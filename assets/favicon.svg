<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Fondo redondeado oscuro -->
  <rect width="64" height="64" rx="16" fill="#0a0d14" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  
  <!-- Icono dinámico que evoca el scroll y la "S" de Scroll Studio -->
  <g filter="url(#glow)">
    <path d="M42 20C42 16.6863 39.3137 14 36 14H26C20.4772 14 16 18.4772 16 24C16 29.5228 20.4772 34 26 34H38C43.5228 34 48 38.4772 48 44C48 49.5228 43.5228 54 38 54H24C20.6863 54 18 51.3137 18 48" 
          fill="none" 
          stroke="url(#scrollGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Detalle de punto central (rueda/foco de scroll) -->
    <circle cx="32" cy="34" r="3" fill="#00f5a0" />
  </g>
</svg>
